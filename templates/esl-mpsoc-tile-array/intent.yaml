# Intent Record — esl-mpsoc-tile-array
#
# Per-figure design record (contract §4 shape; ADR-0005 D3 §4 row). Sidecar
# owned by the backend-adapter, not by opentikz metadata (D2). Uses the
# adapter's `node_family` extension (see tools/adapter/intent.py) instead of
# a literal `nodes` enumeration: this is a `\foreach`-generated array, so
# node_naming expresses the indexed pattern, not an enumeration (cp-4883
# family-wide naming ruling — dash-separated, index-addressable, coordinated
# with WP-4/cp-4892). Commit beside template.tex; validated by
# tools/adapter/checks.py in the verify loop.

slug: esl-mpsoc-tile-array
family: architecture
subject: >-
  Parametric MPSoC tile grid (ntilerows x ntilecols) with a PE sub-grid
  (pegridrows x pegridcols) contained inside each tile, generated by nested
  \foreach loops rather than hand-listed nodes.
thesis: >-
  Node names stay index-addressable (tile-<r>-<c>, pe-<r>-<c>-<k>) at any
  scale, so the same array-scale figure can be targeted by (row,col[,k])
  rather than a hand-listed enumeration -- proven at 32+ tiles.
visual_argument: >-
  A uniform tile grid, each tile containing a PE sub-grid via containment (a
  fit box declared behind its PEs), joined by an O(tiles) inter-tile mesh
  (never a full O(tiles^2) mesh) -- structure and addressability survive
  scaling, not just the small default.

entities:
  - name: tile containers
    role: the tile/cluster container holding a PE sub-grid
    component: tile
    node_family:
      stem: tile
      indices: [row, col]
  - name: processing elements
    role: a PE inside a tile's sub-grid, 1-based flat index within that tile
    component: pe
    node_family:
      stem: pe
      indices: [row, col, k]

relationships:
  - from: processing elements
    to: processing elements
    carries: intra-tile bus (orthogonal row/column lattice, local, never diagonal)
  - from: tile containers
    to: tile containers
    carries: inter-tile NoC mesh (right/below neighbor only, O(tiles) edges)

check_questions:
  - Can the reader identify any PE's tile and position from its node name alone?
  - Does the intra-tile bus read as strictly local (never crossing a tile boundary) and the inter-tile mesh as strictly the fabric between tiles?
  - Is the tile corner label always clear of the PEs it contains, at any grid size?

provenance:
  sources:
    - esl-architecture-block (cp-4856 PoC) tile/PE/bus role and color assignments
  constraints: []

# --- adapter extension: "what varies" (edit_contract.parameters source) --- #
parameters:
  - name: "\\ntilerows"
    type: int
    meaning: number of tile rows in the MPSoC grid
    default: "2"
  - name: "\\ntilecols"
    type: int
    meaning: number of tile columns in the MPSoC grid
    default: "2"
  - name: "\\pegridrows"
    type: int
    meaning: PE sub-grid row count inside each tile
    default: "2"
  - name: "\\pegridcols"
    type: int
    meaning: PE sub-grid column count inside each tile
    default: "2"
  - name: "\\tilelabelprefix"
    type: text
    meaning: 'tile label prefix; rendered as "<prefix><row>.<col>"'
    default: T
  - name: "\\pelabelmode"
    type: enum(index,none)
    meaning: 'PE-node text label: "index" prints the PE''s flat 1-based index, "none" leaves it blank -- the legibility control for large arrays'
    default: index
  - name: "\\tilegapx"
    type: length-cm
    meaning: horizontal gap between tile boundary boxes
    default: "0.9"
  - name: "\\tilegapy"
    type: length-cm
    meaning: vertical gap between tile boundary boxes; must clear the fit box's own top/bottom margins (~0.7cm together, see invariants) or a tile's corner label crowds the tile above it
    default: "1.3"
  - name: "\\pegap"
    type: length-cm
    meaning: gap between PEs within a tile
    default: "0.15"
  - name: "\\pesize"
    type: length-cm
    meaning: PE node minimum size
    default: "0.5"
  - name: "\\showmesh"
    type: bool(0,1)
    meaning: 1 draws the inter-tile NoC mesh (right/below neighbor only, O(tiles)); 0 omits it entirely
    default: "1"
