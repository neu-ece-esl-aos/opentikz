slug: esl-flow-pipeline
family: flow
subject: a two-source task fan-in feeding a parametric transform-stage pipeline that emits one output artifact
thesis: the pipeline reads as a single monotone left-to-right argument -- two tasks join at the pipeline's head, a run of transform stages carries the data forward with no backward edges, and one artifact box at the tail is the only thing that leaves the chain
visual_argument: "task-a and task-b sit stacked at the same x-coordinate (alignment-symmetry) and both fan into stage-1, so the reader reads the join before the chain; every stage sits on one shared horizontal axis (direction-axis) with a dashed group-box wrapping the fused middle stages (containment - grouped stages) to mark them as one logical transform; the output param-node hangs below the last stage, off the main axis (relative-placement), so it reads as a side artifact, not another stage"
entities:
  - name: task a
    role: an upstream task feeding the pipeline
    component: task-node
    nodes: ["task-a"]
  - name: task b
    role: a second upstream task feeding the pipeline
    component: task-node
    nodes: ["task-b"]
  - name: pipeline stage
    role: a transform stage in the pipeline, generated in a row
    component: proc-stage
    nodes: ["stage-<i>"]
  - name: output artifact
    role: the parameter/artifact box the last stage emits
    component: param-node
    nodes: ["param-out"]
  - name: fused-stage group
    role: a caption/legend container marking the fused middle stages as one logical unit
    component: group-box
    nodes: ["fusedgroup"]
relationships:
  - from: task-a
    to: "stage-1"
    carries: input data (fan-in)
  - from: task-b
    to: "stage-1"
    carries: input data (fan-in)
  - from: "stage-<i>"
    to: "stage-<i+1>"
    carries: intermediate tensor/data (monotone chain, direction-axis)
  - from: "stage-<nstages>"
    to: param-out
    carries: final output artifact
check_questions:
  - "Do both task-nodes visibly join at the first pipeline stage?"
  - "Does the stage chain read as one monotone left-to-right axis with no backward edges?"
  - "Is the fused-stage group-box visually distinct from an individual stage?"
  - "Does the output artifact read as a side artifact rather than another pipeline stage?"
provenance:
  sources:
    - "contract/backend-contract-v1.2.0.md §1b flow/DAG vocabulary row"
    - "cp-4892 esl-mpsoc-tile-array foreach generator layer (array-scale convention reused for the stage chain)"
  constraints:
    - "ADR-0005 D3 §1b row: 1:1 node_naming correspondence with the contract component vocabulary"
    - "ADR-0005 D3 §3a: direction-axis / containment / relative-placement / alignment-symmetry primitives realized natively, never invented"
parameters:
  - name: "\\nstages"
    type: int
    meaning: number of pipeline stages in the chain
    default: "4"
  - name: "\\gbstart"
    type: int
    meaning: first stage index the fused-stage group-box wraps (0 = omit the group-box)
    default: "2"
  - name: "\\gbend"
    type: int
    meaning: last stage index the fused-stage group-box wraps
    default: "3"
  - name: "\\stagegap"
    type: length-cm
    meaning: horizontal gap between successive stage boxes
    default: "0.55"
  - name: "\\stagewidth"
    type: length-cm
    meaning: stage box minimum width
    default: "1.5"
  - name: "\\taskalabel"
    type: text
    meaning: task-a label
    default: "Task A"
  - name: "\\taskblabel"
    type: text
    meaning: task-b label
    default: "Task B"
  - name: "\\paramoutlabel"
    type: text
    meaning: output artifact label
    default: "Output"
  - name: "\\groupcaption"
    type: text
    meaning: fused-stage group-box caption
    default: "fused"
