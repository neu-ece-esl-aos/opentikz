# Intent Record — esl-crossbar-array
#
# Per-figure design record (contract §4 shape; ADR-0005 D3 §4 row). Sidecar
# owned by the backend-adapter, not by opentikz metadata (D2). Uses the
# adapter's `node_family` extension (see tools/adapter/intent.py) instead of
# a literal `nodes` enumeration: this is a `\foreach`-generated array, so
# node_naming expresses the indexed pattern, not an enumeration (cp-4883
# family-wide naming ruling — dash-separated, index-addressable, coordinated
# with WP-4/cp-4892). Commit beside template.tex; validated by
# tools/adapter/checks.py in the verify loop.

slug: esl-crossbar-array
family: circuit-schematic
subject: >-
  Parametric nrows x ncols VMM crossbar-cell array (contract §1a
  crossbar-array), generated by nested \foreach loops with row/col-indexed
  node names, row voltage sources, and per-column KCL summation nodes.
thesis: >-
  Row and column wiring is drawn as ONE colinear rail per row/column, never
  point-to-point per cell, so the array stays both correct-looking and
  legible at scale -- proven at 64x64.
visual_argument: >-
  Row voltage sources drive one colinear rail through every cell in the row;
  every column's cells converge on one colinear rail into its KCL node -- the
  same VMM structure as esl-crossbar-kcl's 2x2 hand instance, but
  index-addressable and wired with O(1) rails per row/column instead of
  O(rows*cols) point-to-point edges.

entities:
  - name: row voltage sources
    role: VMM input row driver
    component: v-source
    node_family:
      stem: vin
      indices: [row]
  - name: crossbar weight cells
    role: >-
      VMM weight cell; the full row x col grid together realizes the
      contract's crossbar-array ("a full nrows x ncols VMM cell array,
      placed by row/col index") -- no single node stands for the array as a
      whole, so crossbar-array itself is not separately mapped here
    component: crossbar-cell
    node_family:
      stem: cell
      indices: [row, col]
  - name: per-column KCL nodes
    role: column current-summation node, present only when \showkcl=1
    component: kcl-node
    node_family:
      stem: kcl
      indices: [col]

relationships:
  - from: row voltage sources
    to: crossbar weight cells
    carries: row rail (one colinear draw per row, O(1) edges per row)
  - from: crossbar weight cells
    to: per-column KCL nodes
    carries: column rail (one colinear draw per column, O(1) edges per column)

check_questions:
  - Does every cell in a row visibly share one rail back to its voltage source?
  - Does every cell in a column visibly share one rail down to its KCL node?
  - Can any cell be targeted directly by its (row,col) from the node name alone?

provenance:
  sources:
    - esl-crossbar-kcl (cp-4856 PoC) crossbar/KCL role and color assignments
  constraints: []

# --- adapter extension: "what varies" (edit_contract.parameters source) --- #
parameters:
  - name: "\\nrows"
    type: int
    meaning: number of crossbar rows (VMM input rows)
    default: "2"
  - name: "\\ncols"
    type: int
    meaning: number of crossbar columns (VMM output columns)
    default: "2"
  - name: "\\rowgap"
    type: length-cm
    meaning: vertical gap between rows
    default: "0.7"
  - name: "\\colgap"
    type: length-cm
    meaning: horizontal gap between columns
    default: "0.7"
  - name: "\\cellsize"
    type: length-cm
    meaning: crossbar-cell / vsource / kclnode node size
    default: "0.5"
  - name: "\\celllabelmode"
    type: enum(full,none)
    meaning: '"full" prints $G_{r,c}$ inside each cell; "none" leaves cells blank -- the legibility control for large arrays'
    default: full
  - name: "\\showkcl"
    type: bool(0,1)
    meaning: 1 draws a per-column KCL summation node terminating the column rail; 0 omits it (the column rail still connects every cell in the column)
    default: "1"
  - name: "\\vlabelprefix"
    type: text
    meaning: row voltage-source label prefix
    default: V
  - name: "\\edgelabelstride"
    type: int
    meaning: show a row/col index label only every Nth line (plus the first and last, always); 1 = label every line -- the legibility control for row/col axis annotation at large nrows/ncols
    default: "1"
